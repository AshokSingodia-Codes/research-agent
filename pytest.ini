[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
addopts = 
    -v
    --strict-markers
    -m "unit or integration"
    --cov=app
    --cov-report=term-missing
    --cov-report=html:coverage_html

markers =
    unit: Isolated unit tests for specialists, schemas, tools, auth, budget
    integration: Integration tests for graph execution, API lifecycle, SSE, approval gate, persistence
    chaos: Process crash and resilience chaos tests
    e2e: End-to-end full workflow execution tests
    slow: Tests with higher execution duration
    live: Smoke tests that require real external API keys (skipped by default)
    redis_real: Tests requiring a real Redis instance (skipped locally unless REDIS_URL is reachable)
