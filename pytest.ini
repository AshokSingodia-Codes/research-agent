[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
addopts = 
    -v
    --strict-markers
    -m "not live"
    --cov=app
    --cov-report=term-missing
    --cov-report=html:coverage_html

markers =
    unit: Isolated unit tests for specialists and tools
    integration: Integration tests for graph execution and API endpoints
    budget: Hard budget constraint and circuit breaker tests
    durability: State persistence, checkpointing, and crash recovery tests
    e2e: End-to-end full workflow execution tests
    chaos: Process crash and resilience chaos tests
    live: Smoke tests that require real external API keys (skipped by default)
